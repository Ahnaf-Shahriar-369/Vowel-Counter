<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vowel Counter</title>


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/hover.css/2.3.1/css/hover-min.css">



    <link rel="stylesheet" href="style.css">
</head>
<body>

    





    <style>
    .deco-circle {
        position: absolute;
        background: rgba(255,255,255,0.1);
        border-radius: 50%;
        animation: float 6s ease-in-out infinite;
    }
    
    .deco-circle:nth-child(1) {
        width: 120px;
        height: 120px;
        top: 20%;
        left: 10%;
    }
    
    .deco-circle:nth-child(2) {
        width: 80px;
        height: 80px;
        bottom: 30%;
        right: 15%;
        animation-delay: 0.5s;
    }
    
    .deco-circle:nth-child(3) {
        width: 60px;
        height: 60px;
        top: 50%;
        left: 25%;
        animation-delay: 1s;
    }
    




</style>






<div class="container">



    <div class="header">


    <h1>Vowel Counter</h1>



    </div>








    <div class="textarea">

    <textarea name="vowel-input" id="textarea" cols="30" rows="10" placeholder="enter your text here:"></textarea>

    </div>

    




    <div class="button">

    <button id="btn">Count Vowels</button>

    </div>







    <div class="output">

    <p>your text contains <span class="count">0</span> vowels</p>

    </div>





</div>



















<script src="SCRIPT.JS" ></script>


</body>
</html>
